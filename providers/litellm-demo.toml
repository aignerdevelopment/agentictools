# Example provider profile (source format v1): a LiteLLM-style gateway
# exposing two API families at different paths. Env var NAMES only -
# values are supplied via the environment (.devenvironment convention).
#
# This is a template. Copy it into your own source repo, swap URLs and
# key names for your gateway, and register it under
# [component.provider."<your-name>"] in your harnessator.toml.

name          = "litellm-demo"
default_model = "big"
auth_env      = "LITELLM_API_KEY"

[styles.openai-compatible]
base_url = "https://litellm.example.test/v1"

[styles.anthropic-compatible]
base_url = "https://litellm.example.test/anthropic"

[models]
big   = "claude-sonnet-5"
fast  = "claude-haiku-5.5"
smart = "gpt-5.2"
